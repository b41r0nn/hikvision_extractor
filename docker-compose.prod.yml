services:
  db:
    image: postgres:15-alpine
    container_name: hikvision_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # En producción no exponemos PostgreSQL al exterior; solo la red interna.
    networks:
      - hikvision_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: hikvision_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: America/Bogota
    ports:
      - "8000:8000"
    networks:
      - hikvision_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../frontend.Dockerfile
    container_name: hikvision_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hikvision_net

volumes:
  pgdata:

networks:
  hikvision_net:
    driver: bridge
